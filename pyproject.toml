[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lending-profitability-risk-simulator"
version = "0.1.1"
description = "A transparent expected-value lending, funding, and cash decision model."
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit==1.65.0", "pandas==2.2.3", "plotly==7.1.0", "XlsxWriter==3.2.9"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "openpyxl==3.1.5"]

[tool.setuptools]
packages = ["lending_simulator", "lending_simulator.ui", "lending_simulator.sample_data"]

[tool.setuptools.package-dir]
"lending_simulator.sample_data" = "data"

[tool.setuptools.package-data]
lending_simulator = ["queries/*.sql", "evidence/*.json"]
"lending_simulator.sample_data" = ["applications.csv", "manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["lending_simulator", "app.py"]
